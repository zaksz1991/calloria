name: CALLORIA production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calloria-production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Install, test and build production assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Align npm with Vercel's npm 11 install-script policy
        run: |
          npm install --global npm@11
          node --version
          npm --version

      - name: Install dependencies using the Vercel install command
        run: npm install --no-audit --no-fund

      - name: Run the complete Node test suite
        run: npm test

      - name: Validate the restored build manifest and source graph
        run: npm run check

      - name: Run the Vite production build and post-build artifact audit
        run: npm run build
