name: CALLORIA GLB asset audit and optimization

on:
  push:
    branches:
      - main
    paths:
      - 'public/assets/models/**'
      - 'tools/glb-audit.mjs'
      - 'tools/glb-optimize.mjs'
      - 'tools/promote-glb-optimized-assets.mjs'
      - 'build/calloria-optimized-glb-runtime-plugin.js'
      - 'vite.config.js'
      - '.github/workflows/calloria-glb-asset-optimization.yml'
  workflow_dispatch:
    inputs:
      optimize_assets:
        description: 'Create and publish conservative optimized copies (originals remain unchanged)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: calloria-glb-asset-optimization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-and-optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out CALLORIA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Audit source GLB containers and scene complexity
        run: node tools/glb-audit.mjs --input public/assets/models --output artifacts/glb-source-audit.json

      - name: Install pinned glTF Transform CLI
        if: ${{ github.event_name == 'push' || inputs.optimize_assets }}
        run: npm install --global @gltf-transform/cli@4.5.0

      - name: Create conservative optimized copies
        if: ${{ github.event_name == 'push' || inputs.optimize_assets }}
        run: node tools/glb-optimize.mjs --input public/assets/models --output artifacts/optimized/models --report artifacts/glb-optimization-report.json --cli gltf-transform

      - name: Prepare deployable optimized GLB assets and manifest
        if: ${{ github.event_name == 'push' || inputs.optimize_assets }}
        run: node tools/promote-glb-optimized-assets.mjs --report artifacts/glb-optimization-report.json --input artifacts/optimized/models --output public/assets/models-optimized

      - name: Upload audit and optimization reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calloria-glb-audit-and-optimized-models
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish optimized copies to the selected repository branch
        if: ${{ github.event_name == 'push' || inputs.optimize_assets }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/models-optimized
          if git diff --cached --quiet; then
            echo "No optimized asset changes to publish."
          else
            git commit -m "chore(assets): publish optimized CALLORIA GLB models"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
